name: ESLint

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Validate linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 18
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci || npm install

    - name: Run Linter
      run: npm run lint
